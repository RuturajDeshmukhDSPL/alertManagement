<header class="app-header fixed top-0 left-0 right-0 z-50 h-header-height bg-white/90 backdrop-blur-md shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
  <div class="header-inner w-full h-full px-6 flex items-center justify-between gap-4 border-b border-slate-200 bg-white">
    <div class="flex items-center gap-4 shrink-0">
      <a routerLink="/alerts" class="flex items-center gap-2.5 cursor-pointer">
        <div class="h-8 w-8 rounded-lg bg-blue-600 flex items-center justify-center text-white">
          <span class="material-symbols-outlined text-[18px]">bolt</span>
        </div>
        <span class="text-base font-bold text-slate-900 tracking-tight">PulseAlert</span>
      </a>

      @if (showFacilitySelector()) {
        <div class="h-6 w-px bg-slate-200"></div>

        <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50/70 hover:bg-white hover:border-slate-300 transition-colors">
          <span class="material-symbols-outlined text-[16px] text-slate-400 shrink-0">domain</span>
          <select
            class="bg-transparent border-0 outline-none text-xs font-medium text-slate-700 cursor-pointer pr-1"
            aria-label="Filter by facility"
            [ngModel]="selectedFacilityId() ?? 'all'"
            (ngModelChange)="onFacilityChange($event)"
          >
            <option value="all">All Facilities</option>
            @for (f of facilities(); track f.id) {
              <option [value]="f.id">{{ f.name }}</option>
            }
          </select>
        </div>
      }
    </div>

    @if (showSearch()) {
      <div class="flex-1 max-w-xl mx-4">
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50/70 text-slate-500 focus-within:bg-white focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
          <span class="material-symbols-outlined text-[18px] text-slate-400 shrink-0">search</span>
          <input
            class="w-full bg-transparent border-0 outline-none text-slate-900 placeholder:text-slate-400 text-xs font-normal"
            placeholder="Filter alerts (e.g. env:prod service:auth severity:critical)..."
            type="text"
            [ngModel]="searchTerm()"
            (ngModelChange)="onSearchChange($event)"
          />
        </div>
      </div>
    } @else {
      <div class="flex-1"></div>
    }

    <div class="header-actions flex items-center shrink-0 gap-4">
      <button
        class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 shadow-sm transition-all"
        type="button"
        (click)="openRaiseAlert()"
      >
        <span class="material-symbols-outlined text-[16px]">add</span>
        <span>Raise Alert</span>
      </button>

      <div class="relative">
        <button
          class="flex items-center gap-2 p-1 rounded-lg hover:bg-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-100"
          type="button"
          [attr.aria-expanded]="profileMenuOpen()"
          aria-haspopup="true"
          (click)="toggleProfileMenu()"
        >
          <div class="w-8 h-8 rounded-full bg-slate-200 border border-slate-200 flex items-center justify-center text-slate-600 text-xs font-semibold">
            {{ currentUser().initials }}
          </div>
          <div class="flex flex-col text-left">
            <span class="text-xs font-semibold text-slate-900 leading-tight">{{ currentUser().name }}</span>
            <span class="text-[11px] text-slate-500 font-normal leading-tight">{{ currentUser().role }}</span>
          </div>
          <span class="material-symbols-outlined text-[16px] text-slate-400 ml-0.5">expand_more</span>
        </button>

        @if (profileMenuOpen()) {
          <div
            class="absolute right-0 mt-2 min-w-[200px] bg-white rounded-xl shadow-lg border border-slate-200 py-1.5 z-50"
            role="menu"
          >
            <div class="px-3.5 py-2 border-b border-slate-100">
              <p class="text-xs font-semibold text-slate-900 leading-none">{{ currentUser().name }}</p>
              <p class="text-[11px] text-slate-500 font-normal mt-1 leading-none">{{ currentUser().email }}</p>
            </div>
            <div class="py-1">
              <button
                class="w-full flex items-center gap-2.5 px-3.5 py-2 text-xs text-slate-700 hover:bg-slate-50 hover:text-slate-900 transition-colors text-left"
                type="button"
                (click)="closeProfileMenu()"
              >
                <span class="material-symbols-outlined text-[18px] text-slate-400">settings</span>
                <span>Settings</span>
              </button>
            </div>
            <div class="border-t border-slate-100 my-0.5"></div>
            <div class="py-1">
              <button
                class="w-full flex items-center gap-2.5 px-3.5 py-2 text-xs text-red-600 hover:bg-red-50 transition-colors text-left font-medium"
                type="button"
                (click)="logout()"
              >
                <span class="material-symbols-outlined text-[18px] text-red-500">logout</span>
                <span>Logout</span>
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</header>
