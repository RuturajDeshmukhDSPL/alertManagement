<div class="space-y-6">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Alerts</h1>
      <p class="text-sm text-slate-500 mt-0.5">{{ headerSubtitle() }}</p>
    </div>

    <div class="flex items-center gap-3">
      @if (selectedFacilityName(); as name) {
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-medium">
          <span class="material-symbols-outlined text-[14px]">domain</span>
          {{ name }}
          <button type="button" class="ml-0.5 hover:text-indigo-900 cursor-pointer" title="Clear facility filter" (click)="onClearFacility()">
            <span class="material-symbols-outlined text-[14px]">close</span>
          </button>
        </span>
      }

      <div class="flex items-center gap-1.5 text-xs text-slate-400" title="Auto-refreshes every 30 seconds">
        @if (isRefreshing()) {
          <span class="material-symbols-outlined text-[16px] animate-spin text-blue-500">progress_activity</span>
          <span>Syncing…</span>
        } @else {
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span>Live · updated {{ lastSyncedAt() | date: 'shortTime' }}</span>
        }
        <button
          type="button"
          class="ml-1 p-1 rounded-md hover:bg-slate-100 hover:text-slate-600 transition-colors cursor-pointer"
          title="Refresh now"
          (click)="onManualRefresh()"
        >
          <span class="material-symbols-outlined text-[16px]">refresh</span>
        </button>
      </div>
    </div>
  </div>

  <app-filter-bar
    [filter]="filter()"
    [counts]="counts()"
    [dateFrom]="dateFrom()"
    [dateTo]="dateTo()"
    [hasActiveFilter]="hasActiveFilter()"
    (filterChange)="onFilterChange($event)"
    (dateFromChange)="dateFrom.set($event)"
    (dateToChange)="dateTo.set($event)"
    (applyDate)="onDateApply()"
    (clearDate)="onDateClear()"
    (clearAll)="onClearAll()"
  />

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    <div class="lg:col-span-7">
      <app-alert-list
        [pagedAlerts]="pagedAlerts()"
        [totalMatching]="filteredAlerts().length"
        [selectedCode]="selectedAlert()?.code ?? null"
        [pageSize]="pageSize()"
        [currentPage]="currentPage()"
        (selectAlert)="onSelectAlert($event)"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
        (resetFilters)="onClearAll()"
      />
    </div>

    <div class="lg:col-span-5">
      <app-alert-detail
        [alert]="selectedAlert()"
        (toggleAddressed)="onToggleAddressed($event)"
        (requestClose)="onRequestClose($event)"
        (reopen)="onReopen($event)"
      />
    </div>
  </div>
</div>

@if (pendingCloseAlert(); as pending) {
  <app-confirm-close-modal [alert]="pending" (confirm)="onConfirmClose($event)" (cancel)="onCancelClose()" />
}
