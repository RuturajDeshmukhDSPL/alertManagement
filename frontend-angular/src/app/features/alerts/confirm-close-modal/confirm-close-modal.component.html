<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm" (click)="$event.target === $event.currentTarget && cancel.emit()">
  <div class="relative w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden m-4">
    <div class="p-6">
      <div class="flex items-start gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-[24px]">task_alt</span>
        </div>
        <div class="space-y-1">
          <h3 class="text-base font-bold text-slate-900">Do you want to close this alert?</h3>
          <p class="text-xs text-slate-500 leading-relaxed">
            Closing this alert (<span class="font-mono text-slate-700 font-semibold">{{ alert().code }}</span>) will mark it as resolved and notify the team.
          </p>
        </div>
      </div>
      <div class="mt-6 flex items-center justify-end gap-2.5">
        <button class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer" type="button" (click)="cancel.emit()">
          Cancel
        </button>
        <button
          class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-900 hover:bg-slate-800 text-white shadow-sm transition-all flex items-center gap-1.5 cursor-pointer"
          type="button"
          (click)="confirm.emit(alert())"
        >
          <span class="material-symbols-outlined text-[16px]">check</span>
          <span>Confirm Close</span>
        </button>
      </div>
    </div>
  </div>
</div>
