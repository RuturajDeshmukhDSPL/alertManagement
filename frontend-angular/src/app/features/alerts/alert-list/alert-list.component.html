<div class="alert-list-panel bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col h-[680px]">
  <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between text-xs font-medium text-slate-500 shrink-0 bg-white z-10">
    <!-- <span>
      @if (totalMatching() === 0) {
        0 of {{ totalMatching() }} alerts
      } @else {
        Showing {{ (currentPage() - 1) * pageSize() + 1 }}-{{ Math.min(currentPage() * pageSize(), totalMatching()) }} of {{ totalMatching() }} alerts
      }
    </span> -->
  </div>

  <div class="flex-1 overflow-y-auto custom-scrollbar">
    @if (pagedAlerts().length > 0) {
      <div class="alert-table-scroll overflow-x-auto">
        <table class="w-full text-left border-collapse">
        <thead class="bg-slate-50/80 sticky top-0 z-10 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
          <tr>
            <th class="px-4 py-2.5" scope="col">Severity & ID</th>
            <th class="px-4 py-2.5" scope="col">Alert Title & Summary</th>
            <th class="px-4 py-2.5" scope="col">Source / Service</th>
            <th class="px-4 py-2.5" scope="col">Status</th>
            <th class="px-4 py-2.5" scope="col">Reported</th>
            <th class="px-4 py-2.5 text-right" scope="col">Action</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100 text-xs text-slate-700">
          @for (alert of pagedAlerts(); track alert.code) {
            <tr
              app-alert-row
              [alert]="alert"
              [selected]="alert.code === selectedCode()"
              (select)="selectAlert.emit($event)"
              (inspect)="selectAlert.emit($event)"
            ></tr>
          }
        </tbody>
        </table>
      </div>
    } @else {
      <div class="flex flex-col items-center justify-center p-12 text-center h-full">
        <span class="material-symbols-outlined text-[44px] text-slate-300 mb-2">find_in_page</span>
        <h3 class="text-sm font-semibold text-slate-700">No matching alerts found</h3>
        <p class="text-xs text-slate-400 mt-1 max-w-xs">Try adjusting your filters, search term, or date range to view alerts.</p>
        <button
          class="mt-3 px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 text-xs font-semibold transition-colors cursor-pointer"
          type="button"
          (click)="resetFilters.emit()"
        >
          Reset Filters
        </button>
      </div>
    }
  </div>

  <app-pagination
    [totalItems]="totalMatching()"
    [pageSize]="pageSize()"
    [currentPage]="currentPage()"
    (pageChange)="pageChange.emit($event)"
    (pageSizeChange)="pageSizeChange.emit($event)"
  />
</div>
